version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: project-hub-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: project_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
