version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: capstone-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: capstone-db
      POSTGRES_USER: capstone-db
      POSTGRES_PASSWORD: capstone-db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
