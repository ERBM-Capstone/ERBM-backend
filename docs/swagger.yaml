  /api/v1/expenses/{id}/ocr:
    post:
      consumes:
      - application/json
      description: Synchronous 30-second deadline for the whole file. One OCR at a
        time per Expense across all receipts; PATCH, confirm, reopen and another OCR
        request return 409 while processing. Success autofills the DRAFT for PC review;
        OCR never confirms. Failure, cancellation and timeout release the lock and
        allow retry; failed attempts are not reused as cache. Successful cache is
        reused unless force=true. The custom private provider adapter must be configured.
        Failures include durable extraction metadata in errors.
