basePath: /
definitions:
  dto.AdvanceHistoryActorResponse:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      user_id:
        type: integer
    type: object
  dto.AdvanceHistoryResponse:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/model.AdvanceAction'
        example: RETURN
      actor:
        $ref: '#/definitions/dto.AdvanceHistoryActorResponse'
      amount:
        example: "25000.00"
        type: string
        x-nullable: true
      id:
        type: integer
      occurred_at:
        type: string
      previous_status:
        allOf:
        - $ref: '#/definitions/model.AdvanceStatus'
        x-nullable: true
      purpose:
        type: string
        x-nullable: true
      reason:
        type: string
        x-nullable: true
      resulting_status:
        $ref: '#/definitions/model.AdvanceStatus'
      revision:
        example: 1
        type: integer
        x-nullable: true
    type: object
  dto.AdvanceListItemResponse:
    properties:
      advance_code:
        example: ADV-PRJ001-001
        type: string
      amount:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      project:
        $ref: '#/definitions/dto.AdvanceProjectResponse'
      purpose:
        type: string
      requester:
        $ref: '#/definitions/dto.AdvanceRequesterResponse'
      status:
        $ref: '#/definitions/model.AdvanceStatus'
      submitted_at:
        type: string
        x-nullable: true
      updated_at:
        type: string
    type: object
  dto.AdvanceProjectResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      project_code:
        type: string
    type: object
  dto.AdvanceRequesterResponse:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      user_id:
        type: integer
    type: object
  dto.BaseResponse:
    properties:
      data: {}
      errors:
        items: {}
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/dto.Meta'
      success:
        type: boolean
    type: object
  dto.ConfirmExpenseRequest:
    properties:
      expected_version:
        minimum: 1
        type: integer
    required:
    - expected_version
    type: object
  dto.CreateAdvanceRequest:
    properties:
      amount:
        example: "15000.00"
        type: string
      project_id:
        minimum: 1
        type: integer
      purpose:
        type: string
    required:
    - amount
    - project_id
    - purpose
    type: object
  dto.CreateEmployeeRequest:
    properties:
      date_hired:
        type: string
      email:
        maxLength: 255
        type: string
      employment_end_date:
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
      role_code:
        maxLength: 50
        type: string
    required:
    - date_hired
    - email
    - first_name
    - last_name
    - position
    - role_code
    type: object
  dto.CreateExpenseRequest:
    properties:
      description:
        maxLength: 10000
        type: string
    type: object
  dto.CreateProjectRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      name:
        maxLength: 255
        type: string
      pc_user_id:
        minimum: 1
        type: integer
        x-nullable: true
      pm_user_id:
        minimum: 1
        type: integer
      start_date:
        type: string
    required:
    - name
    type: object
  dto.DeactivateEmployeeRequest:
    properties:
      employment_end_date:
        type: string
    required:
    - employment_end_date
    type: object
  dto.DeletionResponse:
    properties:
      cleanup_pending:
        type: boolean
    type: object
  dto.ExpenseLineItem:
    properties:
      description:
        type: string
      line_no:
        type: integer
      line_total:
        type: string
      page_no:
        type: integer
      quantity:
        type: string
      unit_price:
        type: string
    type: object
  dto.ExpenseResponse:
    properties:
      advance_id:
        type: integer
      amount:
        type: string
      confirmed_at:
        type: string
      confirmed_by:
        type: integer
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      expense_date:
        type: string
      id:
        type: integer
      invoice_no:
        type: string
      line_items:
        items:
          type: object
        type: array
      merchant_name:
        type: string
      needs_confirmation:
        type: boolean
      status:
        $ref: '#/definitions/model.ExpenseStatus'
      updated_at:
        type: string
      version:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  dto.OCRResponse:
    properties:
      cached:
        type: boolean
      created_at:
        type: string
      draft_applied:
        type: boolean
      error_code:
        type: string
      expense:
        $ref: '#/definitions/dto.ExpenseResponse'
      extracted_amount:
        type: string
      extracted_currency:
        type: string
      extraction_id:
        type: integer
      finished_at:
        type: string
      line_items:
        items:
          $ref: '#/definitions/dto.ExpenseLineItem'
        type: array
      model_version:
        type: string
      receipt_id:
        type: integer
      result:
        type: object
      status:
        type: string
    type: object
  dto.ProjectMemberResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      user_id:
        type: integer
    type: object
  dto.ProjectResponse:
    properties:
      description:
        type: string
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
      pc:
        allOf:
        - $ref: '#/definitions/dto.ProjectMemberResponse'
        x-nullable: true
      pm:
        $ref: '#/definitions/dto.ProjectMemberResponse'
      project_code:
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/model.ProjectStatus'
    type: object
  dto.ReadReceiptRequest:
    properties:
      force:
        type: boolean
      receipt_id:
        minimum: 1
        type: integer
    required:
    - receipt_id
    type: object
  dto.ReceiptResponse:
    properties:
      content_type:
        type: string
      expense_id:
        type: integer
      id:
        type: integer
      original_filename:
        type: string
      page_count:
        type: integer
      size_bytes:
        type: integer
      uploaded_at:
        type: string
      uploaded_by:
        type: integer
    type: object
  dto.ReconciliationResponse:
    properties:
      advance_amount:
        type: string
      advance_id:
        type: integer
      confirmed_count:
        type: integer
      expense_count:
        type: integer
      needs_confirmation_count:
        type: integer
      remaining_amount:
        type: string
      total_confirmed_expenses:
        type: string
      unconfirmed_count:
        type: integer
    type: object
  dto.ReopenExpenseRequest:
    properties:
      expected_version:
        minimum: 1
        type: integer
    required:
    - expected_version
    type: object
  dto.ResendActivationRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.ReturnAdvanceRequest:
    properties:
      reason:
        example: กรุณาชี้แจงรายละเอียดค่าเดินทาง
        type: string
    required:
    - reason
    type: object
  dto.SetInitialPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        minLength: 1
        type: string
    required:
    - password
    - token
    type: object
  dto.UpdateAdvanceRequest:
    properties:
      amount:
        example: "15000.00"
        minLength: 1
        type: string
        x-nullable: true
      purpose:
        minLength: 1
        type: string
        x-nullable: true
    type: object
  dto.UpdateEmployeeRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
    type: object
  dto.UpdateExpenseRequest:
    properties:
      amount:
        type: string
      description:
        maxLength: 10000
        type: string
      expected_version:
        minimum: 1
        type: integer
      expense_date:
        type: string
      invoice_no:
        maxLength: 100
        type: string
      line_items:
        items:
          $ref: '#/definitions/dto.ExpenseLineItem'
        type: array
      merchant_name:
        maxLength: 255
        type: string
    required:
    - expected_version
    type: object
  dto.UpdateProjectRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      name:
        maxLength: 255
        type: string
      pc_user_id:
        minimum: 1
        type: integer
        x-nullable: true
      pm_user_id:
        minimum: 1
        type: integer
      start_date:
        type: string
      status:
        enum:
        - CLOSED
        type: string
    type: object
  model.AdvanceAction:
    enum:
    - CREATE
    - UPDATE
    - SUBMIT
    - APPROVE
    - RETURN
    - DISBURSE
    type: string
    x-enum-varnames:
    - AdvanceActionCreate
    - AdvanceActionUpdate
    - AdvanceActionSubmit
    - AdvanceActionApprove
    - AdvanceActionReturn
    - AdvanceActionDisburse
  model.AdvanceStatus:
    enum:
    - DRAFT
    - PENDING_PM_APPROVAL
    - RETURNED_FOR_REVISION
    - APPROVED
    - ACTIVE
    - CLOSED
    type: string
    x-enum-varnames:
    - AdvanceStatusDraft
    - AdvanceStatusPendingPMApproval
    - AdvanceStatusReturnedForRevision
    - AdvanceStatusApproved
    - AdvanceStatusActive
    - AdvanceStatusClosed
  model.ExpenseStatus:
    enum:
    - DRAFT
    - CONFIRMED
    type: string
    x-enum-varnames:
    - ExpenseStatusDraft
    - ExpenseStatusConfirmed
  model.ProjectStatus:
    enum:
    - ACTIVE
    - CLOSED
    type: string
    x-enum-varnames:
    - ProjectStatusActive
    - ProjectStatusClosed
info:
  contact:
    email: support@your-org.com
    name: API Support
  description: Backend service for the Expense Reimbursement and Bill Management System
    (ERBM).
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: ERBM API
  version: "1.0"
paths:
  /api/v1/advances:
    get:
      description: |-
        Lists visible Advances in THB. ADMIN and ACCOUNTING can read every Project; PM sees managed Projects and PC sees assigned Projects. DRAFT is visible only to its creator for every role. Visibility applies before pagination and total count. Sorted by created_at DESC, id DESC.
        Use status=PENDING_PM_APPROVAL for the PM approval screen, status=RETURNED_FOR_REVISION for the PC revision screen, and status=APPROVED for the Accounting approved list. Each uses the same role-based Project visibility and pagination as the general Advance list.
      parameters:
      - description: Filter by accessible Project ID
        in: query
        minimum: 1
        name: project_id
        type: integer
      - description: Advance status
        enum:
        - DRAFT
        - PENDING_PM_APPROVAL
        - RETURNED_FOR_REVISION
        - APPROVED
        - ACTIVE
        - CLOSED
        in: query
        name: status
        type: string
      - description: Case-insensitive search in purpose
        in: query
        maxLength: 255
        name: q
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AdvanceListItemResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List advances
      tags:
      - advances
    post:
      consumes:
      - application/json
      description: PC assigned to an ACTIVE Project creates a DRAFT with a required
        positive THB amount. Codes use ADV-{project_code}-{per-project sequence},
        assigned once at creation. An existing ACTIVE Advance does not block DRAFT
        creation. Creation, code allocation and audit event commit together. Requester
        is the authenticated creator.
      parameters:
      - description: Create Advance draft
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAdvanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdvanceListItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create an advance draft
      tags:
      - advances
  /api/v1/advances/{id}:
    get:
      description: Returns the current Advance with the same fields and visibility
        as the list. ADMIN and ACCOUNTING can read every Project; PM and PC must be
        assigned to its Project. DRAFT is private to its creator for every role.
      parameters:
      - description: Advance ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdvanceListItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get an advance
      tags:
      - advances
    patch:
      consumes:
      - application/json
      description: Only the PC creator who is still assigned to the Project can edit
        purpose and/or amount. Omitted or null fields retain their values; at least
        one non-null field is required. Amount uses the positive decimal-string THB
        rules of creation. Only DRAFT or RETURNED_FOR_REVISION can be edited; the
        result is DRAFT. A closed Project cannot be changed. Update and before/after
        audit snapshots commit together.
      parameters:
      - description: Advance ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Advance update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAdvanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdvanceListItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update an advance draft
      tags:
      - advances
  /api/v1/advances/{id}/approve:
    post:
      description: Only the Project's current PM can approve a PENDING_PM_APPROVAL
        request. No body is required. Sets APPROVED, approved_at/by and updated_at/by;
        preserves the submitted contents and writes an APPROVE audit event atomically.
        Repeated or conflicting review returns 409. A closed Project cannot be changed.
      parameters:
      - description: Advance ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdvanceListItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Approve an advance request
      tags:
      - advances
  /api/v1/advances/{id}/disburse:
    post:
      description: Only ACCOUNTING can confirm a single full payment of the stored
        approved amount. No body is required; client fields cannot change the amount,
        actor or payment time. The server records payment and confirmation time, activated_at
        and a DISBURSE audit event, and changes APPROVED to ACTIVE in one transaction.
        Returns the existing Advance detail response. A closed Project, non-APPROVED
        Advance, previous payment or another ACTIVE Advance in the Project returns
        409. Concurrent confirmations cannot create duplicate payments or multiple
        ACTIVE Advances. MD signature remains outside the system in phase 1.
      parameters:
      - description: Advance ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdvanceListItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Confirm full disbursement of an approved advance
      tags:
      - advances
  /api/v1/advances/{id}/expenses:
    get:
      parameters:
      - description: Advance ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ExpenseResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List Advance expenses
      tags:
      - expenses
    post:
      consumes:
      - application/json
      description: Only the assigned PC creator of an ACTIVE Advance. The empty object
        is valid; amount starts null and status starts DRAFT.
      parameters:
      - description: Advance ID
        in: path
        name: id
        required: true
        type: integer
      - description: Draft
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ExpenseResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create an unconfirmed Expense before uploading receipts
      tags:
      - expenses
  /api/v1/advances/{id}/history:
    get:
      description: Returns all recorded workflow actions, newest first by occurred_at
        DESC and event ID DESC, without pagination. Includes actor ID/current name,
        previous/resulting status, nullable reason and event timestamp. SUBMIT events
        include a per-Advance revision number starting at 1 in event-ID order, plus
        the exact THB amount and purpose from that submission's immutable snapshot.
        Revision, amount and purpose are null for other actions; missing snapshot
        fields stay null. No full before/after snapshots are exposed. Uses the same
        current Project access and private-DRAFT visibility as GET detail. An existing
        Advance with no events returns an empty array. Reading history does not change
        the Advance. Replaces the separate revisions endpoint.
