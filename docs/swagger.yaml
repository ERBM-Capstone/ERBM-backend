  /api/v1/projects:
    get:
      description: Returns projects in a paginated standard response envelope. ADMIN
        and ACCOUNTING see every project; PM and PC only see projects they belong
        to.
      parameters:
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Search project code or name
        in: query
        name: q
        type: string
      - description: Project status
        enum:
        - ACTIVE
        - CLOSED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProjectResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: 'Creates a project with a server-generated project_code: PRJ-{Gregorian
        year in Asia/Bangkok}-{number, minimum 6 digits}, starting at 000001 each
        year. Clients do not send project_code; a supplied value is ignored. A project
        has at most one PC. Optional pc_user_id accepts one positive user ID; the
        same PC may coordinate multiple projects. ADMIN and PC must send pm_user_id.
        A PM creator becomes its PM; a PC creator becomes its sole PC and cannot assign
        another PC at creation.'
      parameters:
      - description: Create project payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProjectResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /api/v1/projects/{id}:
    get:
      description: Returns a single project with its PM and an assigned pc object
        or null. PM and PC can only open projects they belong to.
      parameters:
      - description: Project ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProjectResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Partially updates a project. Omit pc_user_id to keep its PC, send
        a positive user ID to replace it, or null to remove it. Replacing or removing
        PC requires every existing Advance to be CLOSED, including DRAFT and APPROVED.
        ADMIN and the project's PM can edit fields and assignments; the assigned PC
        can only change name and description. Only the project's PM can close it by
        sending status "CLOSED". Closing returns 409 if any Advance in this Project
        is not CLOSED, including DRAFT. A closed project cannot be changed.
      parameters:
      - description: Project ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Project update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProjectResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - projects
  /api/v1/projects/assignees:
    get:
      description: 'Returns ACTIVE accounts for the required PM or PC role, with user_id,
        first_name, last_name and email. Requires ADMIN, PM or PC. Searches full name
        or email case-insensitively and sorts by first name, last name and user ID.
        Users already assigned to other projects remain eligible. Creation rules still
        apply: a PM creator becomes the PM; a PC creator becomes the PC.'
      parameters:
      - description: Assignment role
        enum:
        - PM
        - PC
        in: query
        name: role
        required: true
        type: string
      - description: Search full name or email
        in: query
        maxLength: 255
        name: q
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProjectMemberResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List eligible project assignees
      tags:
      - projects
  /api/v1/roles:
    get:
      description: Returns roles available for employee provisioning. Requires the
        ADMIN role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List application roles
      tags:
      - roles
