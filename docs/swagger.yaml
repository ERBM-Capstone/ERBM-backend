basePath: /
definitions:
  dto.BaseResponse:
    properties:
      data: {}
      errors:
        items: {}
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/dto.Meta'
      success:
        type: boolean
    type: object
  dto.CreateEmployeeRequest:
    properties:
      date_hired:
        type: string
      email:
        maxLength: 255
        type: string
      employment_end_date:
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
      role_code:
        maxLength: 50
        type: string
    required:
    - date_hired
    - email
    - first_name
    - last_name
    - position
    - role_code
    type: object
  dto.CreateProjectRequest:
    properties:
      budget:
        type: string
      description:
        type: string
      end_date:
        type: string
      name:
        maxLength: 255
        type: string
      pc_user_ids:
        items:
          type: integer
        type: array
      pm_user_id:
        minimum: 1
        type: integer
      project_code:
        maxLength: 50
        type: string
      start_date:
        type: string
    required:
    - budget
    - name
    - project_code
    type: object
  dto.DeactivateEmployeeRequest:
    properties:
      employment_end_date:
        type: string
    required:
    - employment_end_date
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  dto.UpdateEmployeeRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
    type: object
  dto.UpdateProjectRequest:
    properties:
      budget:
        type: string
      description:
        type: string
      end_date:
        type: string
      name:
        maxLength: 255
        type: string
      pc_user_ids:
        items:
          type: integer
        type: array
      pm_user_id:
        minimum: 1
        type: integer
      start_date:
        type: string
      status:
        enum:
        - CLOSED
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@your-org.com
    name: API Support
  description: Backend service for the Expense Reimbursement and Bill Management System
    (ERBM).
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: ERBM API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies an active user's credentials, returns an access token,
        and sets an HttpOnly refresh cookie.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Log in with email and password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Clears the refresh-token cookie. Tokens are not revoked server-side.
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Validates the HttpOnly refresh cookie and returns a new access
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Refresh an access token
      tags:
      - auth
  /api/v1/employees:
    get:
      description: Returns employees in a paginated standard response envelope. Requires
        the ADMIN role.
      parameters:
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List employees
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Creates employee profiles and invited login accounts for active
        employees. role_code is required and independent of the HR position. Requires
        the ADMIN role.
      parameters:
      - description: Create employee payloads
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/dto.CreateEmployeeRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create employee
      tags:
      - employees
  /api/v1/employees/{id}:
    get:
      description: Returns a single employee by ID. Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get employee
      tags:
      - employees
    patch:
      consumes:
      - application/json
      description: Partially updates an employee profile. Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Employee update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update employee
      tags:
      - employees
  /api/v1/employees/{id}/deactivate:
    patch:
      consumes:
      - application/json
      description: Records an employee's employment end date and deactivates the associated
        login account. Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Employment end date
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeactivateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Deactivate employee
      tags:
      - employees
  /api/v1/me:
    get:
      description: Returns the current account, role, and linked employee profile.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get the authenticated user's profile
      tags:
      - auth
  /api/v1/projects:
    get:
      description: Returns projects in a paginated standard response envelope. ADMIN
        and ACCOUNTING see every project; PM and PC only see projects they belong
        to.
      parameters:
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Search project code or name
        in: query
        name: q
        type: string
      - description: Project status
        enum:
        - ACTIVE
        - CLOSED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Creates a project. ADMIN and PC must send pm_user_id. A PM who
        creates a project becomes its PM, and a PC who creates a project is added
        to its PCs. budget is a decimal string such as "1000.00".
      parameters:
      - description: Create project payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /api/v1/projects/{id}:
    get:
      description: Returns a single project with its PM and PCs. PM and PC can only
        open projects they belong to.
      parameters:
      - description: Project ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Partially updates a project. ADMIN and the project's PM can change
        every field; a PC of the project can only change name and description. Only
        the project's PM can close it by sending status "CLOSED", and a closed project
        cannot be changed.
      parameters:
      - description: Project ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Project update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - projects
  /api/v1/roles:
    get:
      description: Returns roles available for employee provisioning. Requires the
        ADMIN role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List application roles
      tags:
      - roles
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
