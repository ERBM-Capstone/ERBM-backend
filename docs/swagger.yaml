basePath: /
definitions:
  dto.CreateEmployeeRequest:
    properties:
      date_hired:
        type: string
      email:
        maxLength: 255
        type: string
      employment_end_date:
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
    required:
    - date_hired
    - email
    - first_name
    - last_name
    - position
    type: object
  dto.CreateExampleRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.DeleteResponse:
    properties:
      message:
        type: string
    type: object
  dto.EmployeeResponse:
    properties:
      created_at:
        type: string
      date_hired:
        type: string
      email:
        type: string
      employment_end_date:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      position:
        type: string
      updated_at:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.ExampleResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/model.ExampleStatus'
      updated_at:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
    type: object
  dto.UpdateExampleRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.ExampleStatus'
        enum:
        - active
        - inactive
    type: object
  model.ExampleStatus:
    enum:
    - active
    - inactive
    type: string
    x-enum-varnames:
    - ExampleStatusActive
    - ExampleStatusInactive
host: localhost:8080
info:
  contact:
    email: support@your-org.com
    name: API Support
  description: Backend service for project-hub.
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: Project Hub API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies an active user's credentials, returns an access token,
        and sets an HttpOnly refresh cookie.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Log in with email and password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Clears the refresh-token cookie. Tokens are not revoked server-side.
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Validates the HttpOnly refresh cookie and returns a new access
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh an access token
      tags:
      - auth
  /api/v1/employees:
    post:
      consumes:
      - application/json
      description: Creates employee profiles and invited login accounts for active
        employees. Role is derived from position. Requires the ADMIN role.
      parameters:
      - description: Create employee payloads
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/dto.CreateEmployeeRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/dto.EmployeeResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create employee
      tags:
      - employees
  /api/v1/examples:
    get:
      description: Returns all non-deleted examples ordered by updated_at DESC.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ExampleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List examples
      tags:
      - examples
    post:
      consumes:
      - application/json
      description: Inserts a new example. Requires admin or editor role.
      parameters:
      - description: Create payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExampleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ExampleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create example
      tags:
      - examples
  /api/v1/examples/{id}:
    delete:
      description: Soft-deletes an example. Requires admin or editor role.
      parameters:
      - description: Example UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete example
      tags:
      - examples
    get:
      description: Returns a single non-deleted example.
      parameters:
      - description: Example UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExampleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get example by ID
      tags:
      - examples
    put:
      consumes:
      - application/json
      description: Partially updates an existing non-deleted example. Requires admin
        or editor role.
      parameters:
      - description: Example UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExampleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update example
      tags:
      - examples
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
