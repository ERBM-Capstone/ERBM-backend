basePath: /
definitions:
  dto.AdvanceListItemResponse:
    properties:
      advance_code:
        example: ADV-PRJ001-001
        type: string
      amount:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      project:
        $ref: '#/definitions/dto.AdvanceProjectResponse'
      purpose:
        type: string
      requester:
        $ref: '#/definitions/dto.AdvanceRequesterResponse'
      status:
        $ref: '#/definitions/model.AdvanceStatus'
      submitted_at:
        type: string
        x-nullable: true
      updated_at:
        type: string
    type: object
  dto.AdvanceProjectResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      project_code:
        type: string
    type: object
  dto.AdvanceRequesterResponse:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      user_id:
        type: integer
    type: object
  dto.BaseResponse:
    properties:
      data: {}
      errors:
        items: {}
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/dto.Meta'
      success:
        type: boolean
    type: object
  dto.CreateAdvanceRequest:
    properties:
      amount:
        example: "15000.00"
        type: string
      project_id:
        minimum: 1
        type: integer
      purpose:
        type: string
    required:
    - amount
    - project_id
    - purpose
    type: object
  dto.CreateEmployeeRequest:
    properties:
      date_hired:
        type: string
      email:
        maxLength: 255
        type: string
      employment_end_date:
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
      role_code:
        maxLength: 50
        type: string
    required:
    - date_hired
    - email
    - first_name
    - last_name
    - position
    - role_code
    type: object
  dto.CreateProjectRequest:
    properties:
      budget:
        type: string
      description:
        type: string
      end_date:
        type: string
      name:
        maxLength: 255
        type: string
      pc_user_id:
        minimum: 1
        type: integer
        x-nullable: true
      pm_user_id:
        minimum: 1
        type: integer
      start_date:
        type: string
    required:
    - budget
    - name
    type: object
  dto.DeactivateEmployeeRequest:
    properties:
      employment_end_date:
        type: string
    required:
    - employment_end_date
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  dto.ProjectMemberResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      user_id:
        type: integer
    type: object
  dto.ProjectResponse:
    properties:
      budget:
        type: string
      closed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
      pc:
        allOf:
        - $ref: '#/definitions/dto.ProjectMemberResponse'
        x-nullable: true
      pm:
        $ref: '#/definitions/dto.ProjectMemberResponse'
      project_code:
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/model.ProjectStatus'
      updated_at:
        type: string
    type: object
  dto.ResendActivationRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.SetInitialPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        minLength: 1
        type: string
    required:
    - password
    - token
    type: object
  dto.UpdateEmployeeRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 255
        type: string
      last_name:
        maxLength: 255
        type: string
      position:
        maxLength: 255
        type: string
    type: object
  dto.UpdateProjectRequest:
    properties:
      budget:
        type: string
      description:
        type: string
      end_date:
        type: string
      name:
        maxLength: 255
        type: string
      pc_user_id:
        minimum: 1
        type: integer
        x-nullable: true
      pm_user_id:
        minimum: 1
        type: integer
      start_date:
        type: string
      status:
        enum:
        - CLOSED
        type: string
    type: object
  model.AdvanceStatus:
    enum:
    - DRAFT
    - PENDING_PM_APPROVAL
    - RETURNED_FOR_REVISION
    - APPROVED
    - ACTIVE
    - CLOSED
    type: string
    x-enum-varnames:
    - AdvanceStatusDraft
    - AdvanceStatusPendingPMApproval
    - AdvanceStatusReturnedForRevision
    - AdvanceStatusApproved
    - AdvanceStatusActive
    - AdvanceStatusClosed
  model.ProjectStatus:
    enum:
    - ACTIVE
    - CLOSED
    type: string
    x-enum-varnames:
    - ProjectStatusActive
    - ProjectStatusClosed
host: localhost:8080
info:
  contact:
    email: support@your-org.com
    name: API Support
  description: Backend service for the Expense Reimbursement and Bill Management System
    (ERBM).
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: ERBM API
  version: "1.0"
paths:
  /api/v1/advances:
    get:
      description: Lists visible Advances in THB. ADMIN and ACCOUNTING can read every
        Project; PM sees managed Projects and PC sees assigned Projects. DRAFT is
        visible only to its creator for every role. Visibility applies before pagination
        and total count. Sorted by created_at DESC, id DESC.
      parameters:
      - description: Filter by accessible Project ID
        in: query
        minimum: 1
        name: project_id
        type: integer
      - description: Advance status
        enum:
        - DRAFT
        - PENDING_PM_APPROVAL
        - RETURNED_FOR_REVISION
        - APPROVED
        - ACTIVE
        - CLOSED
        in: query
        name: status
        type: string
      - description: Case-insensitive search in purpose
        in: query
        maxLength: 255
        name: q
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AdvanceListItemResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List advances
      tags:
      - advances
    post:
      consumes:
      - application/json
      description: PC assigned to an ACTIVE Project creates a DRAFT with a required
        positive THB amount. Codes use ADV-{project_code}-{per-project sequence},
        assigned once at creation. An existing ACTIVE Advance does not block DRAFT
        creation. Creation, code allocation and audit event commit together. Requester
        is the authenticated creator.
      parameters:
      - description: Create Advance draft
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAdvanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdvanceListItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create an advance draft
      tags:
      - advances
  /api/v1/auth/activation/resend:
    post:
      consumes:
      - application/json
      description: Always returns the same result to avoid revealing whether an email
        has an invited account.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResendActivationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Request a new activation link
      tags:
      - auth
  /api/v1/auth/activation/set-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Activation token and initial password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetInitialPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Set an initial password from an activation link
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies an active user's credentials, returns an access token,
        and sets an HttpOnly refresh cookie.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Log in with email and password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Clears the refresh-token cookie. Tokens are not revoked server-side.
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Validates the HttpOnly refresh cookie and returns a new access
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Refresh an access token
      tags:
      - auth
  /api/v1/employees:
    get:
      description: Returns employees in a paginated standard response envelope. Requires
        the ADMIN role.
      parameters:
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List employees
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Creates employee profiles and invited login accounts for active
        employees. role_code is required and independent of the HR position. Requires
        the ADMIN role.
      parameters:
      - description: Create employee payloads
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/dto.CreateEmployeeRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create employee
      tags:
      - employees
  /api/v1/employees/{id}:
    get:
      description: Returns a single employee by ID. Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get employee
      tags:
      - employees
    patch:
      consumes:
      - application/json
      description: Partially updates an employee profile. Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Employee update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update employee
      tags:
      - employees
  /api/v1/employees/{id}/deactivate:
    patch:
      consumes:
      - application/json
      description: Records an employee's employment end date and deactivates the associated
        login account. Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Employment end date
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeactivateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Deactivate employee
      tags:
      - employees
  /api/v1/employees/{id}/resend-activation:
    post:
      description: Replaces every outstanding activation link for an invited employee.
        Requires the ADMIN role.
      parameters:
      - description: Employee ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Resend an employee activation link
      tags:
      - employees
  /api/v1/me:
    get:
      description: Returns the current account, role, and linked employee profile.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get the authenticated user's profile
      tags:
      - auth
  /api/v1/projects:
    get:
      description: Returns projects in a paginated standard response envelope. ADMIN
        and ACCOUNTING see every project; PM and PC only see projects they belong
        to.
      parameters:
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Search project code or name
        in: query
        name: q
        type: string
      - description: Project status
        enum:
        - ACTIVE
        - CLOSED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProjectResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: 'Creates a project with a server-generated project_code: PRJ-{Gregorian
        year in Asia/Bangkok}-{number, minimum 6 digits}, starting at 000001 each
        year. Clients do not send project_code; a supplied value is ignored. A project
        has at most one PC. Optional pc_user_id accepts one positive user ID; the
        same PC may coordinate multiple projects. ADMIN and PC must send pm_user_id.
        A PM creator becomes its PM; a PC creator becomes its sole PC and cannot assign
        another PC at creation. budget is a decimal string such as "1000.00".'
      parameters:
      - description: Create project payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProjectResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /api/v1/projects/{id}:
    get:
      description: Returns a single project with its PM and an assigned pc object
        or null. PM and PC can only open projects they belong to.
      parameters:
      - description: Project ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProjectResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Partially updates a project. Omit pc_user_id to keep its PC, send
        a positive user ID to replace it, or null to remove it. ADMIN and the project's
        PM can edit fields and assignments; the assigned PC can only change name and
        description. Only the project's PM can close it by sending status "CLOSED".
        Closing returns 409 if any Advance in this Project is not CLOSED, including
        DRAFT. A closed project cannot be changed.
      parameters:
