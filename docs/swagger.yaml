  /api/v1/expenses/{id}/reopen:
    post:
      consumes:
      - application/json
      description: Only the assigned PC creator while the Advance is ACTIVE and no
        OCR is processing in the Expense. Keeps the single amount, clears confirmation,
        and removes the Expense from actual totals until PC confirms again. Increments
        version to invalidate stale forms. The change and audit commit atomically.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      - description: Current version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReopenExpenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ExpenseResponse'
